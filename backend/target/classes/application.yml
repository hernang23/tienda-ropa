spring:
  application:
    name: tienda-ropa-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tienda_ropa}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate   # El esquema lo gobierna Flyway; Hibernate solo valida
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: America/Bogota
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Secreto SOLO por variable de entorno. Minimo 256 bits para HS256.
    secret: ${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1zZWNyZXRvLWNoYW5nZWItZW4tcHJvZHVjY2lvbi0yNTYtYml0cw==}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:480}
  cors:
    origenes-permitidos: ${CORS_ORIGINES:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.tienda.ropa: ${LOG_LEVEL_APP:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
# Perfil de pruebas: H2 en memoria + Flyway deshabilitado (esquema especifico de PostgreSQL)
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:tiendapruebas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
