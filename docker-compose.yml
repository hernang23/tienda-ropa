# ============================================================
# tienda-ropa - Orquestacion local/produccion sencilla
# Uso:  cp .env.example .env  &&  docker compose up -d --build
# ============================================================
name: tienda-ropa

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tienda_ropa}
      POSTGRES_USER: ${DB_USER:-tienda}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Expone PostgreSQL solo en localhost para depuracion; comente si no lo necesita
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tienda} -d ${DB_NAME:-tienda_ropa}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tienda_ropa}
      DB_USER: ${DB_USER:-tienda}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env (openssl rand -base64 48)}
      JWT_EXPIRACION_MINUTOS: ${JWT_EXPIRACION_MINUTOS:-480}
      CORS_ORIGINES: ${CORS_ORIGINES:-http://localhost:3000}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  pgdata:
